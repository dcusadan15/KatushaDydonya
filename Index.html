<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>У меня вопрос ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat',sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)), url('1.jpg');
            background-size: cover;
            background-position: center;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 390px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
            animation: fade .7s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            font-size: 52px;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            margin-top: 18px;
            font-size: 30px;
        }

        p {
            margin-top: 14px;
            line-height: 1.5;
            opacity: .95;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        button {
            border: none;
            border-radius: 18px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s;
        }

            button:hover {
                transform: scale(1.03);
            }

        .whiteBtn {
            background: white;
            color: #ff2d55;
        }

        .pinkBtn {
            background: #ff2d55;
            color: white;
        }

        .option {
            margin-top: 14px;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.2);
            padding: 15px;
            border-radius: 18px;
            cursor: pointer;
            transition: .25s;
        }

            .option:hover {
                background: rgba(255,255,255,.28);
                transform: scale(1.02);
            }

        .hidden {
            display: none;
        }

        .final {
            margin-top: 20px;
            font-size: 22px;
            line-height: 1.5;
            animation: fade .5s ease;
        }

        .small {
            margin-top: 18px;
            font-size: 13px;
            opacity: .75;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <!-- ЭКРАН 1 -->

        <div id="screen1">

            <h1>Зая </h1>

            <p>
                Ты меня любишь?<br>
            </p>

            <div class="buttons">

                <button class="whiteBtn" onclick="showDate()">
                    Да ❤️
                </button>

                <button class="pinkBtn" onclick="showDate()">
                    Конечно да 😌
                </button>

            </div>


        </div>

        <!-- ЭКРАН 2 -->

        <div id="screen2" class="hidden">

            <h1>Выбирай когда мы с тобой вкусно покушаем</h1>

            <div class="option" onclick="showFood()">
                Сразу как только я приеду ❤️
            </div>

        </div>

        <!-- ЭКРАН 3 -->

        <div id="screen3" class="hidden">

            <h1>И последнее </h1>

            <p>
                Что будем кушать?
            </p>

            <div class="option" onclick="finish('🍕 Пиццу')">
                🍕 Пицца
            </div>

            <div class="option" onclick="finish('🍣 Роллы')">
                🍣 Роллы
            </div>

            <div class="option" onclick="finish('🥡 Вок')">
                🥡 Вок
            </div>

            <div class="option" onclick="finish('🍔 Бургеры')">
                🍔 Бургеры
            </div>

            <div class="option" onclick="finish('🍝 Пасту')">
                🍝 Паста
            </div>

        </div>

        <!-- ЭКРАН 4 -->

        <div id="screen4" class="hidden">

            <h1>Спасибо ❤️</h1>

            <div class="final" id="finalText"></div>

        </div>

    </div>

    <script>

        function showDate() {
            document.getElementById("screen1").classList.add("hidden");
            document.getElementById("screen2").classList.remove("hidden");
        }

        function showFood() {
            document.getElementById("screen2").classList.add("hidden");
            document.getElementById("screen3").classList.remove("hidden");
        }

        function finish(food) {

            document.getElementById("screen3").classList.add("hidden");
            document.getElementById("screen4").classList.remove("hidden");

            document.getElementById("finalText").innerHTML =
                `
          Я тоже тебя Люблю ❤️
        `;
        }

    </script>

</body>
</html>
